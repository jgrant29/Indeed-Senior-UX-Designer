ng into three written insight cards on the right.\" style=\"background:var(--bg);border:1px solid var(--rule);padding:14px;display:grid;grid-template-columns:1.15fr 1fr;gap:12px\">\n        <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:5px;align-content:start\">\n          <span style=\"aspect-ratio:1;background:#f0e6c8\"><\u002Fspan><span style=\"aspect-ratio:1;background:#f0e6c8\"><\u002Fspan><span style=\"aspect-ratio:1;background:#e8eadf\"><\u002Fspan><span style=\"aspect-ratio:1;background:#f0e6c8\"><\u002Fspan><span style=\"aspect-ratio:1;background:#efe0d8\"><\u002Fspan>\n          <span style=\"aspect-ratio:1;background:#e8eadf\"><\u002Fspan><span style=\"aspect-ratio:1;background:#f0e6c8\"><\u002Fspan><span style=\"aspect-ratio:1;background:#efe0d8\"><\u002Fspan><span style=\"aspect-ratio:1;background:#e8eadf\"><\u002Fspan><span style=\"aspect-ratio:1;background:#f0e6c8\"><\u002Fspan>\n          <span style=\"aspect-ratio:1;background:#efe0d8\"><\u002Fspan><span style=\"aspect-ratio:1;background:#e8eadf\"><\u002Fspan><span style=\"aspect-ratio:1;background:#f0e6c8\"><\u002Fspan><span style=\"aspect-ratio:1;background:#f0e6c8\"><\u002Fspan><span style=\"aspect-ratio:1;background:#e8eadf\"><\u002Fspan>\n          <span style=\"aspect-ratio:1;background:#f0e6c8\"><\u002Fspan><span style=\"aspect-ratio:1;background:#efe0d8\"><\u002Fspan><span style=\"aspect-ratio:1;background:#e8eadf\"><\u002Fspan><span style=\"aspect-ratio:1;background:#efe0d8\"><\u002Fspan><span style=\"aspect-ratio:1;background:#f0e6c8\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;justify-content:center\">\n          <div style=\"background:#fff;border:1px solid var(--rule);border-left:3px solid var(--ac);padding:9px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:400 8px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)\">Decision 01<\u002Fspan><span style=\"height:4px;width:88%;background:#ece5d8\"><\u002Fspan><span style=\"height:4px;width:66%;background:#f1ebdf\"><\u002Fspan><\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid var(--rule);border-left:3px solid var(--ac);padding:9px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:400 8px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)\">Decision 02<\u002Fspan><span style=\"height:4px;width:80%;background:#ece5d8\"><\u002Fspan><span style=\"height:4px;width:58%;background:#f1ebdf\"><\u002Fspan><\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid var(--rule);border-left:3px solid var(--ac);padding:9px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:400 8px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)\">Decision 03<\u002Fspan><span style=\"height:4px;width:92%;background:#ece5d8\"><\u002Fspan><span style=\"height:4px;width:70%;background:#f1ebdf\"><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Ninety sticky notes become three decisions. The middle step is the work.<\u002Ffigcaption>\n    <\u002Ffigure>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(48px,7vw,92px)\">\n      <p style=\"margin:0 0 12px;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Part 01 / Methods<\u002Fp>\n      <h3 style=\"margin:0;max-width:30ch;font:400 clamp(24px,3.2vw,38px)/1.08 var(--d);letter-spacing:-.02em;text-wrap:balance\">Methods, shown as a real practice<\u002Fh3>\n      <div data-reveal=\"\" style=\"margin-top:clamp(24px,3vw,36px);display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:clamp(14px,2vw,20px)\">\n        <div style=\"background:var(--bg);border:1px solid var(--rule);padding:18px;display:flex;flex-direction:column;gap:11px\">\n          <span aria-hidden=\"true\" style=\"display:flex;align-items:center;gap:5px;height:20px\"><span style=\"width:16px;height:16px;border:1.5px solid var(--acl);border-radius:50%\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:50%;background:var(--ac)\"><\u002Fspan><\u002Fspan>\n          <h4 style=\"margin:0;font:500 15.5px var(--s)\">Generative<\u002Fh4>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:var(--mid)\">I reach for these when nobody agrees yet on what the problem actually is.<\u002Fp>\n          <ul style=\"margin:0;padding:11px 0 0;list-style:none;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:7px;font-size:14px;line-height:1.45;color:var(--mid)\">\n            <li>Contextual inquiry and ethnographic observation<\u002Fli>\n            <li>Semi-structured and depth interviews<\u002Fli>\n            <li>Diary and field observation<\u002Fli>\n            <li>Participatory and co-design workshops<\u002Fli>\n            <li>Focus groups, in person and remote<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"background:var(--bg);border:1px solid var(--rule);padding:18px;display:flex;flex-direction:column;gap:11px\">\n          <span aria-hidden=\"true\" style=\"display:flex;align-items:center;gap:5px;height:20px\"><span style=\"width:16px;height:16px;border:1.5px solid var(--acl)\"><\u002Fspan><span style=\"width:9px;height:9px;background:var(--ac)\"><\u002Fspan><\u002Fspan>\n          <h4 style=\"margin:0;font:500 15.5px var(--s)\">Evaluative<\u002Fh4>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:var(--mid)\">I reach for these the moment there is something to react to, even a rough one.<\u002Fp>\n          <ul style=\"margin:0;padding:11px 0 0;list-style:none;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:7px;font-size:14px;line-height:1.45;color:var(--mid)\">\n            <li>Formal and informal usability testing<\u002Fli>\n            <li>Moderated and unmoderated studies<\u002Fli>\n            <li>Concept and prototype testing<\u002Fli>\n            <li>Heuristic evaluation<\u002Fli>\n            <li>Accessibility testing with assistive technology<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"background:var(--bg);border:1px solid var(--rule);padding:18px;display:flex;flex-direction:column;gap:11px\">\n          <span aria-hidden=\"true\" style=\"display:flex;align-items:flex-end;gap:4px;height:20px\"><span style=\"width:5px;height:8px;background:#ddd3bf\"><\u002Fspan><span style=\"width:5px;height:14px;background:var(--acl)\"><\u002Fspan><span style=\"width:5px;height:20px;background:var(--ac)\"><\u002Fspan><\u002Fspan>\n          <h4 style=\"margin:0;font:500 15.5px var(--s)\">Quantitative<\u002Fh4>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:var(--mid)\">I reach for these to size a problem, and to check whether a qualitative finding holds.<\u002Fp>\n          <ul style=\"margin:0;padding:11px 0 0;list-style:none;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:7px;font-size:14px;line-height:1.45;color:var(--mid)\">\n            <li>Large-scale surveys, 10,000+ responses analyzed<\u002Fli>\n            <li>Behavioral analytics and funnel review<\u002Fli>\n            <li>False-door and live experiments<\u002Fli>\n            <li>Usability benchmarking with UMUX-Lite<\u002Fli>\n            <li>Triangulating qual and quant<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"background:var(--bg);border:1px solid var(--rule);padding:18px;display:flex;flex-direction:column;gap:11px\">\n          <span aria-hidden=\"true\" style=\"display:grid;grid-template-columns:7px 7px;gap:3px;height:20px;align-content:center\"><span style=\"height:7px;background:var(--acl)\"><\u002Fspan><span style=\"height:7px;background:#ddd3bf\"><\u002Fspan><span style=\"height:7px;background:#ddd3bf\"><\u002Fspan><span style=\"height:7px;background:var(--ac)\"><\u002Fspan><\u002Fspan>\n          <h4 style=\"margin:0;font:500 15.5px var(--s)\">Synthesis and delivery<\u002Fh4>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:var(--mid)\">I reach for these to turn a pile of notes into a decision somebody can act on.<\u002Fp>\n          <ul style=\"margin:0;padding:11px 0 0;list-style:none;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:7px;font-size:14px;line-height:1.45;color:var(--mid)\">\n            <li>Affinity mapping and thematic analysis<\u002Fli>\n            <li>Personas, journey maps, and service blueprints<\u002Fli>\n            <li>Opportunity framing and prioritization<\u002Fli>\n            <li>Executive storytelling and readouts<\u002Fli>\n            <li>Research repositories and reusable templates<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <figure data-reveal=\"\" style=\"margin:clamp(22px,3vw,32px) 0 0;max-width:720px;display:flex;flex-direction:column;gap:10px\">\n        <div role=\"img\" aria-label=\"Method selection matrix placeholder: problem types listed down the left, research methods across the top, with one highlighted cell per row drawing a path through the grid.\" style=\"background:var(--bg);border:1px solid var(--rule);padding:16px\">\n          <div style=\"display:grid;grid-template-columns:minmax(96px,1.1fr) repeat(4,1fr);gap:6px;align-items:center;font:400 9.5px/1.3 var(--m)\">\n            <span><\u002Fspan><span style=\"color:var(--soft)\">Interview<\u002Fspan><span style=\"color:var(--soft)\">Field<\u002Fspan><span style=\"color:var(--soft)\">Usability<\u002Fspan><span style=\"color:var(--soft)\">Survey<\u002Fspan>\n            <span style=\"color:var(--mid)\">Nobody agrees on the problem<\u002Fspan><span style=\"height:22px;background:#ece5d8\"><\u002Fspan><span style=\"height:22px;background:var(--ac)\"><\u002Fspan><span style=\"height:22px;background:#ece5d8\"><\u002Fspan><span style=\"height:22px;background:#ece5d8\"><\u002Fspan>\n            <span style=\"color:var(--mid)\">Qual and quant disagree<\u002Fspan><span style=\"height:22px;background:var(--ac)\"><\u002Fspan><span style=\"height:22px;background:#ece5d8\"><\u002Fspan><span style=\"height:22px;background:#ece5d8\"><\u002Fspan><span style=\"height:22px;background:#ece5d8\"><\u002Fspan>\n            <span style=\"color:var(--mid)\">There is a prototype<\u002Fspan><span style=\"height:22px;background:#ece5d8\"><\u002Fspan><span style=\"height:22px;background:#ece5d8\"><\u002Fspan><span style=\"height:22px;background:var(--ac)\"><\u002Fspan><span style=\"height:22px;background:#ece5d8\"><\u002Fspan>\n            <span style=\"color:var(--mid)\">We need to size it<\u002Fspan><span style=\"height:22px;background:#ece5d8\"><\u002Fspan><span style=\"height:22px;background:#ece5d8\"><\u002Fspan><span style=\"height:22px;background:#ece5d8\"><\u002Fspan><span style=\"height:22px;background:var(--ac)\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">The method is a choice, not a habit. This is how I pick.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(48px,7vw,92px)\">\n      <p style=\"margin:0 0 12px;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Part 02 / Three studies<\u002Fp>\n      <h3 style=\"margin:0;max-width:30ch;font:400 clamp(24px,3.2vw,38px)/1.08 var(--d);letter-spacing:-.02em;text-wrap:balance\">Question, method, finding, and the thing that changed<\u002Fh3>\n\n      <article style=\"margin-top:clamp(30px,4vw,52px);padding-top:clamp(22px,3vw,34px);border-top:2px solid var(--ink)\">\n        <p style=\"margin:0 0 10px;font:400 10px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Story A<\u002Fp>\n        <h4 style=\"margin:0;max-width:32ch;font:400 clamp(22px,2.8vw,34px)/1.12 var(--d);letter-spacing:-.018em;text-wrap:balance\">“I asked for the first contextual inquiry this company had ever run”<\u002Fh4>\n        <p style=\"margin:12px 0 0;font:400 12.5px/1.5 var(--m);color:var(--ac)\">McGraw-Hill, ALEKS / AI-driven math platform<\u002Fp>\n        <div data-reveal=\"\" style=\"margin-top:clamp(22px,3vw,34px);display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:clamp(20px,3vw,36px)\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <h5 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Question<\u002Fh5>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:var(--mid)\">Usability tests kept saying the tool was fine. Teachers kept saying it was not. Why the gap?<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <h5 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Method<\u002Fh5>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:var(--mid)\">I argued for going into classrooms. That became the organization's first contextual inquiry, alongside interviews, in-classroom and remote focus groups with 50+ teachers, and 10,000+ survey responses across students and teachers in nine states.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <h5 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">What I found<\u002Fh5>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:var(--mid)\">Teachers could not see who was struggling <em>while it was happening<\u002Fem>. The data existed, it just was not where they were looking.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <h5 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--ac)\">What changed<\u002Fh5>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:var(--mid)\">Real-time student data surfaced in the teacher dashboard, plus accessibility-driven interaction changes. Measured usability rose from 73 to 82 and teacher workload dropped. I presented the work to executives, board members, and investors.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"margin-top:clamp(22px,3vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(18px,2.5vw,28px)\">\n          <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n            <div role=\"img\" aria-label=\"Photo placeholder: classroom observation from the back of the room, a teacher working at a smartboard while students work at laptops.\" style=\"background:#efe9dd;border:1px solid var(--rule);min-height:168px;display:grid;place-items:center;background-image:repeating-linear-gradient(135deg,rgba(28,26,23,.06) 0 1px,transparent 1px 9px)\"><span style=\"font:400 10px/1.6 var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--mid);text-align:center;background:rgba(255,253,249,.9);padding:8px 12px\">[ photo ]<br>classroom observation, back of room<\u002Fspan><\u002Fdiv>\n            <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Nine states, real class periods. You cannot see this in a lab.<\u002Ffigcaption>\n          <\u002Ffigure>\n          <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n            <div role=\"img\" aria-label=\"Before and after dashboard placeholder: the original teacher dashboard on the left, and on the right the same dashboard with a needs help now row appearing at the top.\" style=\"background:var(--bg);border:1px solid var(--rule);padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n              <div style=\"border:1px solid var(--rule);background:#fff;padding:9px;display:flex;flex-direction:column;gap:5px\">\n                <span style=\"font:400 8px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)\">Before<\u002Fspan>\n                <span style=\"height:5px;width:70%;background:#ece5d8\"><\u002Fspan><span style=\"height:5px;width:88%;background:#f1ebdf\"><\u002Fspan><span style=\"height:5px;width:64%;background:#f1ebdf\"><\u002Fspan><span style=\"height:5px;width:80%;background:#f1ebdf\"><\u002Fspan><span style=\"height:5px;width:58%;background:#f1ebdf\"><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--ink);background:#fff;padding:9px;display:flex;flex-direction:column;gap:5px\">\n                <span style=\"font:400 8px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--ac)\">After<\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:4px;background:var(--acs);padding:3px 4px\"><span style=\"width:5px;height:5px;border-radius:50%;background:#a8452b\"><\u002Fspan><span style=\"font:400 7.5px var(--m);color:var(--ink)\">needs help now / 4<\u002Fspan><\u002Fspan>\n                <span style=\"height:5px;width:88%;background:#f1ebdf\"><\u002Fspan><span style=\"height:5px;width:64%;background:#f1ebdf\"><\u002Fspan><span style=\"height:5px;width:80%;background:#f1ebdf\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">The finding, turned into one row at the top of the screen.<\u002Ffigcaption>\n          <\u002Ffigure>\n          <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n            <div role=\"img\" aria-label=\"Benchmark chart placeholder: two UMUX-Lite score bars, seventy three before and eighty two after the redesign.\" style=\"background:var(--bg);border:1px solid var(--rule);padding:14px;display:flex;flex-direction:column;gap:9px;min-height:168px\">\n              <span style=\"font:400 9px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)\">UMUX-Lite<\u002Fspan>\n              <div style=\"flex:1;display:flex;align-items:flex-end;gap:16px;padding-top:8px\">\n                <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:6px\"><span style=\"width:100%;height:73px;background:#ddd3bf\"><\u002Fspan><span style=\"font:400 11px var(--m);color:var(--mid)\">73<\u002Fspan><\u002Fdiv>\n                <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:6px\"><span style=\"width:100%;height:98px;background:var(--ac)\"><\u002Fspan><span style=\"font:400 11px var(--m);color:var(--ink)\">82<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Benchmarked before and after, so the change was arguable in numbers.<\u002Ffigcaption>\n          <\u002Ffigure>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article style=\"margin-top:clamp(40px,5vw,72px);padding-top:clamp(22px,3vw,34px);border-top:2px solid var(--ink)\">\n        <p style=\"margin:0 0 10px;font:400 10px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Story B<\u002Fp>\n        <h4 style=\"margin:0;max-width:32ch;font:400 clamp(22px,2.8vw,34px)/1.12 var(--d);letter-spacing:-.018em;text-wrap:balance\">“Directing research so it survives the researcher”<\u002Fh4>\n        <p style=\"margin:12px 0 0;font:400 12.5px/1.5 var(--m);color:var(--ac)\">Indeed, Business Technology / Employee Listening<\u002Fp>\n        <div data-reveal=\"\" style=\"margin-top:clamp(22px,3vw,34px);display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:clamp(20px,3vw,36px)\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <h5 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Question<\u002Fh5>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:var(--mid)\">How do 7,000 accounts move to a new platform without breaking how people actually work?<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <h5 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Method<\u002Fh5>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:var(--mid)\">I directed two researchers across generative and evaluative studies, running 100+ interviews and formal and informal usability tests. I built the research operation underneath it: participant recruiting, reusable study templates, and tagging and documentation in Dovetail.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <h5 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">What I found<\u002Fh5>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:var(--mid)\">The migration risk was not technical. It sat in the workflows nobody had documented.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <h5 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--ac)\">What changed<\u002Fh5>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:var(--mid)\">Personas and portfolio-level research artifacts that guided the migration and shaped roadmap and cost decisions, delivered to the C-suite. The repository outlasted the project.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"margin-top:clamp(22px,3vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(18px,2.5vw,28px)\">\n          <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n            <div role=\"img\" aria-label=\"Persona set placeholder: three persona cards side by side, each with a portrait circle, a role line, and quoted needs.\" style=\"background:var(--bg);border:1px solid var(--rule);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:168px\">\n              <div style=\"flex:1;display:flex;flex-direction:column;gap:7px\">\n                <div style=\"background:#fff;border:1px solid var(--rule);padding:8px;display:flex;gap:8px;align-items:center\"><span style=\"width:22px;height:22px;border-radius:50%;background:#e7dfd0\"><\u002Fspan><span style=\"flex:1;display:flex;flex-direction:column;gap:4px\"><span style=\"height:5px;width:52%;background:#ece5d8;display:block\"><\u002Fspan><span style=\"height:4px;width:78%;background:#f1ebdf;display:block\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n                <div style=\"background:#fff;border:1px solid var(--rule);border-left:3px solid var(--ac);padding:8px;display:flex;gap:8px;align-items:center\"><span style=\"width:22px;height:22px;border-radius:50%;background:#e7dfd0\"><\u002Fspan><span style=\"flex:1;display:flex;flex-direction:column;gap:4px\"><span style=\"height:5px;width:64%;background:#ece5d8;display:block\"><\u002Fspan><span style=\"height:4px;width:70%;background:#f1ebdf;display:block\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n                <div style=\"background:#fff;border:1px solid var(--rule);padding:8px;display:flex;gap:8px;align-items:center\"><span style=\"width:22px;height:22px;border-radius:50%;background:#e7dfd0\"><\u002Fspan><span style=\"flex:1;display:flex;flex-direction:column;gap:4px\"><span style=\"height:5px;width:46%;background:#ece5d8;display:block\"><\u002Fspan><span style=\"height:4px;width:84%;background:#f1ebdf;display:block\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font:400 9px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)\">Personas / 3 of 6<\u002Fspan>\n            <\u002Fdiv>\n            <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Personas built from interviews, used to argue about scope.<\u002Ffigcaption>\n          <\u002Ffigure>\n          <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n            <div role=\"img\" aria-label=\"Research repository placeholder: a tag rail on the left and a list of tagged interview highlights on the right.\" style=\"background:var(--bg);border:1px solid var(--rule);padding:12px;display:grid;grid-template-columns:64px 1fr;gap:10px;min-height:168px\">\n              <div style=\"display:flex;flex-direction:column;gap:5px\">\n                <span style=\"font:400 8px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)\">Tags<\u002Fspan>\n                <span style=\"height:11px;background:var(--acs);border:1px solid var(--acl)\"><\u002Fspan><span style=\"height:11px;background:#e8eadf\"><\u002Fspan><span style=\"height:11px;background:#efe0d8\"><\u002Fspan><span style=\"height:11px;background:#e8eadf\"><\u002Fspan><span style=\"height:11px;background:var(--acs);border:1px solid var(--acl)\"><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid var(--rule);padding:9px;display:flex;flex-direction:column;gap:7px\">\n                <span style=\"display:flex;gap:5px;align-items:center\"><span style=\"width:16px;height:7px;background:var(--acl)\"><\u002Fspan><span style=\"flex:1;height:5px;background:#ece5d8\"><\u002Fspan><\u002Fspan>\n                <span style=\"display:flex;gap:5px;align-items:center\"><span style=\"width:16px;height:7px;background:#dfe2d5\"><\u002Fspan><span style=\"flex:1;height:5px;background:#f1ebdf\"><\u002Fspan><\u002Fspan>\n                <span style=\"display:flex;gap:5px;align-items:center\"><span style=\"width:16px;height:7px;background:var(--acl)\"><\u002Fspan><span style=\"flex:1;height:5px;background:#ece5d8\"><\u002Fspan><\u002Fspan>\n                <span style=\"display:flex;gap:5px;align-items:center\"><span style=\"width:16px;height:7px;background:#e9d5cc\"><\u002Fspan><span style=\"flex:1;height:5px;background:#f1ebdf\"><\u002Fspan><\u002Fspan>\n                <span style=\"display:flex;gap:5px;align-items:center\"><span style=\"width:16px;height:7px;background:#dfe2d5\"><\u002Fspan><span style=\"flex:1;height:5px;background:#f1ebdf\"><\u002Fspan><\u002Fspan>\n                <span style=\"margin-top:auto;font:400 8px var(--m);color:var(--soft)\">142 highlights / 18 studies<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Tagged, searchable, and still in use after I left the project.<\u002Ffigcaption>\n          <\u002Ffigure>\n          <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n            <div role=\"img\" aria-label=\"Photo placeholder: a whiteboard workflow map of the migration, with two risk points circled in red marker.\" style=\"background:#efe9dd;border:1px solid var(--rule);min-height:168px;display:grid;place-items:center;background-image:repeating-linear-gradient(135deg,rgba(28,26,23,.06) 0 1px,transparent 1px 9px)\"><span style=\"font:400 10px/1.6 var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--mid);text-align:center;background:rgba(255,253,249,.9);padding:8px 12px\">[ photo ]<br>workflow map, risk points circled<\u002Fspan><\u002Fdiv>\n            <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Two circles on this board became the migration plan's hard questions.<\u002Ffigcaption>\n          <\u002Ffigure>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article style=\"margin-top:clamp(40px,5vw,72px);padding-top:clamp(22px,3vw,34px);border-top:2px solid var(--ink)\">\n        <p style=\"margin:0 0 10px;font:400 10px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Story C<\u002Fp>\n        <h4 style=\"margin:0;max-width:32ch;font:400 clamp(22px,2.8vw,34px)/1.12 var(--d);letter-spacing:-.018em;text-wrap:balance\">“Watching people argue with a machine”<\u002Fh4>\n        <p style=\"margin:12px 0 0;font:400 12.5px/1.5 var(--m);color:var(--ac)\">Mozilla Data Collective / LLM data assistant and pricing<\u002Fp>\n        <div data-reveal=\"\" style=\"margin-top:clamp(22px,3vw,34px);display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:clamp(20px,3vw,36px)\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <h5 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Question<\u002Fh5>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:var(--mid)\">What happens when an AI assistant is confidently wrong, and what should the interface do about it?<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <h5 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Method<\u002Fh5>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:var(--mid)\">Rapid, continuous usability testing on the assistant, plus a live false-door pricing test paired with a 50-respondent pricing study.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <h5 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">What I found<\u002Fh5>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:var(--mid)\">Trust broke at the moment of uncertainty, not the moment of error. And stated willingness to pay did not match actual behavior.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <h5 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--ac)\">What changed<\u002Fh5>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:var(--mid)\">Findings reshaped UI components and fed model-training decisions, and the pricing evidence reset the subscription and paid-dataset strategy from opinion to data.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"margin-top:clamp(22px,3vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(18px,2.5vw,28px)\">\n          <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n            <div role=\"img\" aria-label=\"Session replay placeholder: a recorded test session frame with a playback timeline and a marker on the moment the participant got confused.\" style=\"background:var(--bg);border:1px solid var(--rule);padding:12px;display:flex;flex-direction:column;gap:9px;min-height:168px\">\n              <div style=\"flex:1;background:#22201d;padding:9px;display:flex;flex-direction:column;gap:5px\">\n                <span style=\"font:400 8px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:#8b8378\">Session 14 / replay<\u002Fspan>\n                <span style=\"height:4px;width:72%;background:#4a453e\"><\u002Fspan><span style=\"height:4px;width:56%;background:#4a453e\"><\u002Fspan><span style=\"height:4px;width:64%;background:#6b6152\"><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:6px\">\n                <span style=\"flex:1;height:5px;background:#e0d8c8;position:relative\"><span style=\"position:absolute;left:58%;top:-4px;width:3px;height:13px;background:#a8452b\"><\u002Fspan><\u002Fspan>\n                <span style=\"font:400 8.5px var(--m);color:var(--mid)\">04:12<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Four minutes twelve seconds. The moment trust left the room.<\u002Ffigcaption>\n          <\u002Ffigure>\n          <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n            <div role=\"img\" aria-label=\"Uncertainty states placeholder: two versions of the assistant answer side by side, one asserting confidently and one showing a hedged answer with its sources.\" style=\"background:var(--bg);border:1px solid var(--rule);padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:168px\">\n              <div style=\"border:1px solid #d8b3a8;background:#fff;padding:9px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:400 8px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:#a8452b\">Confident, wrong<\u002Fspan><span style=\"height:5px;width:92%;background:#f0e2dd\"><\u002Fspan><span style=\"height:5px;width:76%;background:#f0e2dd\"><\u002Fspan><span style=\"height:5px;width:84%;background:#f0e2dd\"><\u002Fspan><\u002Fdiv>\n              <div style=\"border:1px solid var(--ink);background:#fff;padding:9px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:400 8px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--ac)\">Hedged, sourced<\u002Fspan><span style=\"height:5px;width:88%;background:#ece5d8\"><\u002Fspan><span style=\"height:5px;width:70%;background:#ece5d8\"><\u002Fspan><span style=\"margin-top:auto;font:400 7.5px var(--m);color:var(--ac);border-top:1px solid var(--rule);padding-top:5px\">confidence: low / 2 sources<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Saying “I am not sure” well turned out to be a component problem.<\u002Ffigcaption>\n          <\u002Ffigure>\n          <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n            <div role=\"img\" aria-label=\"False-door test placeholder: a three step flow from pricing page to plan selection, with the click-through step highlighted and the measured drop noted.\" style=\"background:var(--bg);border:1px solid var(--rule);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:168px\">\n              <span style=\"font:400 9px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)\">False-door flow<\u002Fspan>\n              <div style=\"flex:1;display:flex;align-items:center;gap:7px\">\n                <div style=\"flex:1;border:1px solid var(--rule);background:#fff;padding:7px;display:flex;flex-direction:column;gap:4px\"><span style=\"height:4px;width:70%;background:#ece5d8\"><\u002Fspan><span style=\"height:9px;width:100%;background:#f1ebdf\"><\u002Fspan><\u002Fdiv>\n                <span aria-hidden=\"true\" style=\"font:400 11px var(--m);color:var(--acl)\">→<\u002Fspan>\n                <div style=\"flex:1;border:1px solid var(--ink);background:var(--acs);padding:7px;display:flex;flex-direction:column;gap:4px\"><span style=\"height:4px;width:60%;background:#e2d6b6\"><\u002Fspan><span style=\"height:9px;width:100%;background:var(--ac)\"><\u002Fspan><\u002Fdiv>\n                <span aria-hidden=\"true\" style=\"font:400 11px var(--m);color:var(--acl)\">→<\u002Fspan>\n                <div style=\"flex:1;border:1px dashed #cdc4b3;background:#fff;padding:7px;display:flex;flex-direction:column;gap:4px\"><span style=\"height:4px;width:52%;background:#f1ebdf\"><\u002Fspan><span style=\"height:9px;width:100%;background:#f6f1e7\"><\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font:400 8.5px/1.4 var(--m);color:var(--mid)\">stated intent, high / observed click-through, lower<\u002Fspan>\n            <\u002Fdiv>\n            <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">What people said they would pay, next to what they did.<\u002Ffigcaption>\n          <\u002Ffigure>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(48px,7vw,92px)\">\n      <p style=\"margin:0 0 12px;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Part 03 / Research ops and rigor<\u002Fp>\n      <h3 style=\"margin:0;max-width:30ch;font:400 clamp(24px,3.2vw,38px)/1.08 var(--d);letter-spacing:-.02em;text-wrap:balance\">Repeatable practices<\u002Fh3>\n      <div style=\"margin-top:clamp(24px,3vw,36px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(24px,4vw,48px);align-items:start\">\n        <div>\n          <p style=\"margin:0;max-width:56ch;font-size:16.5px;line-height:1.6;color:var(--mid);text-wrap:pretty\">Most of what makes research usable happens around the study. I build recruiting pipelines so the next round does not start from zero, write study templates a product manager can pick up, and keep a tagged repository where a finding can be found six months later by someone who was not in the session. Readouts get rewritten per audience: a working session with engineers and designers looks nothing like a fifteen-minute board update, and it should not.<\u002Fp>\n          <figure data-reveal=\"\" style=\"margin:clamp(20px,3vw,28px) 0 0;display:flex;flex-direction:column;gap:10px\">\n            <div role=\"img\" aria-label=\"Repository placeholder: a research repository screen showing tag filters, saved study templates, and a consent form thumbnail.\" style=\"background:var(--bg);border:1px solid var(--rule);padding:12px;display:grid;grid-template-columns:1.4fr 1fr;gap:10px\">\n              <div style=\"background:#fff;border:1px solid var(--rule);padding:9px;display:flex;flex-direction:column;gap:6px\">\n                <span style=\"font:400 8px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)\">Templates<\u002Fspan>\n                <span style=\"display:flex;gap:5px;align-items:center\"><span style=\"width:14px;height:7px;background:var(--acl)\"><\u002Fspan><span style=\"flex:1;height:5px;background:#ece5d8\"><\u002Fspan><\u002Fspan>\n                <span style=\"display:flex;gap:5px;align-items:center\"><span style=\"width:14px;height:7px;background:var(--acl)\"><\u002Fspan><span style=\"flex:1;height:5px;background:#ece5d8\"><\u002Fspan><\u002Fspan>\n                <span style=\"display:flex;gap:5px;align-items:center\"><span style=\"width:14px;height:7px;background:#ddd3bf\"><\u002Fspan><span style=\"flex:1;height:5px;background:#f1ebdf\"><\u002Fspan><\u002Fspan>\n                <span style=\"display:flex;gap:5px;align-items:center\"><span style=\"width:14px;height:7px;background:#ddd3bf\"><\u002Fspan><span style=\"flex:1;height:5px;background:#f1ebdf\"><\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid var(--rule);padding:9px;display:flex;flex-direction:column;gap:5px\">\n                <span style=\"font:400 8px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--ac)\">Consent<\u002Fspan>\n                <span style=\"height:4px;width:88%;background:#f1ebdf\"><\u002Fspan><span style=\"height:4px;width:76%;background:#f1ebdf\"><\u002Fspan><span style=\"height:4px;width:82%;background:#f1ebdf\"><\u002Fspan>\n                <span style=\"margin-top:auto;height:12px;width:52%;border:1px solid var(--rule)\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Research ops is just respect for the next person who has to find this.<\u002Ffigcaption>\n          <\u002Ffigure>\n        <\u002Fdiv>\n        <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0;border-top:1px solid var(--ink)\">\n          <li style=\"display:grid;grid-template-columns:minmax(70px,84px) 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule)\"><span style=\"font:400 10px/1.5 var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--ac)\">Certified<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:var(--mid)\">CITI Program certification, Human Subjects Research (Social, Behavioral &amp; Economic), valid through 2027<\u002Fspan><\u002Fli>\n          <li style=\"display:grid;grid-template-columns:minmax(70px,84px) 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule)\"><span style=\"font:400 10px/1.5 var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--ac)\">Ethics<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:var(--mid)\">Informed consent, participant privacy, and data handling in governance-heavy domains<\u002Fspan><\u002Fli>\n          <li style=\"display:grid;grid-template-columns:minmax(70px,84px) 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule)\"><span style=\"font:400 10px/1.5 var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--ac)\">A11y<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:var(--mid)\">Accessibility research with assistive technology, including NVDA<\u002Fspan><\u002Fli>\n          <li style=\"display:grid;grid-template-columns:minmax(70px,84px) 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule)\"><span style=\"font:400 10px/1.5 var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--ac)\">Published<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:var(--mid)\"><em>Accountability for the Hidden Codes Toward a Better User Experience<\u002Fem>, ACM SIGDOC, 2021<\u002Fspan><\u002Fli>\n          <li style=\"display:grid;grid-template-columns:minmax(70px,84px) 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule)\"><span style=\"font:400 10px/1.5 var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--ac)\">Degree<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:var(--mid)\">M.S., Human-Computer Interaction, UC Santa Cruz<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" style=\"margin-top:clamp(48px,7vw,92px);padding:clamp(26px,4vw,40px) 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)\">\n      <div style=\"display:grid;grid-template-columns:minmax(110px,132px) 1fr;gap:10px 24px;align-items:baseline\">\n        <span style=\"font:400 10.5px/1.5 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Studied with<\u002Fspan>\n        <p style=\"margin:0;font:400 clamp(17px,1.9vw,23px)/1.5 var(--d);color:var(--ink);text-wrap:pretty\">middle-school students <span aria-hidden=\"true\" style=\"color:var(--acl)\">·<\u002Fspan> classroom teachers across nine states <span aria-hidden=\"true\" style=\"color:var(--acl)\">·<\u002Fspan> enterprise internal-tool users <span aria-hidden=\"true\" style=\"color:var(--acl)\">·<\u002Fspan> global volunteer contributors in 51+ languages <span aria-hidden=\"true\" style=\"color:var(--acl)\">·<\u002Fspan> HR and compliance administrators <span aria-hidden=\"true\" style=\"color:var(--acl)\">·<\u002Fspan> open-data scientists and partners<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-top:clamp(18px,2.5vw,26px);padding-top:clamp(18px,2.5vw,26px);border-top:1px solid var(--rule);display:grid;grid-template-columns:minmax(110px,132px) 1fr;gap:10px 24px;align-items:baseline\">\n        <span style=\"font:400 10.5px/1.5 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Reported to<\u002Fspan>\n        <p style=\"margin:0;font:400 clamp(17px,1.9vw,23px)/1.5 var(--d);color:var(--ink);text-wrap:pretty\">engineers and designers in working sessions <span aria-hidden=\"true\" style=\"color:var(--acl)\">·<\u002Fspan> product and program managers <span aria-hidden=\"true\" style=\"color:var(--acl)\">·<\u002Fspan> the C-suite at Indeed <span aria-hidden=\"true\" style=\"color:var(--acl)\">·<\u002Fspan> executives, board members, and investors at McGraw-Hill <span aria-hidden=\"true\" style=\"color:var(--acl)\">·<\u002Fspan> the CEO, weekly, at Mozilla<\u002Fp>\n      <\u002Fdiv>\n      <figure style=\"margin:clamp(22px,3vw,32px) 0 0;display:flex;flex-direction:column;gap:10px;max-width:720px\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n          <div role=\"img\" aria-label=\"Photo placeholder: a classroom research session, participant and moderator side by side at a student laptop.\" style=\"background:#efe9dd;border:1px solid var(--rule);min-height:150px;display:grid;place-items:center;background-image:repeating-linear-gradient(135deg,rgba(28,26,23,.06) 0 1px,transparent 1px 9px)\"><span style=\"font:400 9.5px/1.6 var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--mid);text-align:center;background:rgba(255,253,249,.9);padding:7px 10px\">[ photo ]<br>classroom session<\u002Fspan><\u002Fdiv>\n          <div role=\"img\" aria-label=\"Photo placeholder: a boardroom readout, slides on the wall and executives around the table.\" style=\"background:#efe9dd;border:1px solid var(--rule);min-height:150px;display:grid;place-items:center;background-image:repeating-linear-gradient(135deg,rgba(28,26,23,.06) 0 1px,transparent 1px 9px)\"><span style=\"font:400 9.5px/1.6 var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--mid);text-align:center;background:rgba(255,253,249,.9);padding:7px 10px\">[ photo ]<br>boardroom readout<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Same findings. Two completely different rooms, two completely different stories.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" style=\"margin-top:clamp(40px,5vw,72px);background:var(--bg);border:1px solid var(--rule);padding:clamp(20px,3vw,30px);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(20px,3vw,32px);align-items:center\">\n      <div>\n        <h3 style=\"margin:0;font:400 clamp(21px,2.4vw,29px)/1.12 var(--d);letter-spacing:-.018em\">Teaching it<\u002Fh3>\n        <p style=\"margin:12px 0 0;max-width:52ch;font-size:16px;line-height:1.6;color:var(--mid);text-wrap:pretty\">I co-founded UCLA HUE with an HCI professor, guest lectured at UCLA on web accessibility and usability testing, and mentored 11 HCI graduate students at UC Santa Cruz into jobs and graduate programs.<\u002Fp>\n      <\u002Fdiv>\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n        <div role=\"img\" aria-label=\"Photo placeholder: a lecture hall seen from the presenter's angle, students seated and a slide projected behind.\" style=\"background:#efe9dd;border:1px solid var(--rule);min-height:148px;display:grid;place-items:center;background-image:repeating-linear-gradient(135deg,rgba(28,26,23,.06) 0 1px,transparent 1px 9px)\"><span style=\"font:400 9.5px/1.6 var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--mid);text-align:center;background:rgba(255,253,249,.9);padding:7px 10px\">[ photo ]<br>lecture hall, presenter's angle<\u002Fspan><\u002Fdiv>\n        <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Guest lecture on accessibility and usability testing, UCLA.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n\n    <blockquote style=\"margin:clamp(52px,8vw,104px) auto clamp(16px,3vw,32px);max-width:26ch;text-align:center\">\n      <p style=\"margin:0;font:400 clamp(24px,3.4vw,42px)/1.18 var(--d);letter-spacing:-.02em;text-wrap:balance\">“Every study on this page ended in something that shipped.”<\u002Fp>\n    <\u002Fblockquote>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"toolbox\" style=\"padding:clamp(48px,6vw,80px) clamp(20px,5vw,64px);border-top:1px solid var(--rule)\">\n  <div style=\"max-width:1120px;margin:0 auto\">\n    <p style=\"margin:0 0 20px;font:400 11px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Toolbox<\u002Fp>\n    <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:9px\">\n      <li style=\"font:400 13px var(--m);padding:8px 13px;border:1px solid var(--rule);background:var(--paper)\">Figma<\u002Fli>\n      <li style=\"font:400 13px var(--m);padding:8px 13px;border:1px solid var(--rule);background:var(--paper)\">Figma AI<\u002Fli>\n      <li style=\"font:400 13px var(--m);padding:8px 13px;border:1px solid var(--rule);background:var(--paper)\">Figma Make<\u002Fli>\n      <li style=\"font:400 13px var(--m);padding:8px 13px;border:1px solid var(--rule);background:var(--paper)\">Claude<\u002Fli>\n      <li style=\"font:400 13px var(--m);padding:8px 13px;border:1px solid var(--rule);background:var(--paper)\">Claude Code<\u002Fli>\n      <li style=\"font:400 13px var(--m);padding:8px 13px;border:1px solid var(--rule);background:var(--paper)\">Cursor<\u002Fli>\n      <li style=\"font:400 13px var(--m);padding:8px 13px;border:1px solid var(--rule);background:var(--paper)\">Google Analytics<\u002Fli>\n      <li style=\"font:400 13px var(--m);padding:8px 13px;border:1px solid var(--rule);background:var(--paper)\">Google Search Console<\u002Fli>\n      <li style=\"font:400 13px var(--m);padding:8px 13px;border:1px solid var(--rule);background:var(--paper)\">Google Lighthouse<\u002Fli>\n      <li style=\"font:400 13px var(--m);padding:8px 13px;border:1px solid var(--rule);background:var(--paper)\">Jira<\u002Fli>\n      <li style=\"font: 400 13px var(--m); padding: 8px 13px; border: 1px solid var(--rule); background-color: #FFFDF9\">Confluence<\u002Fli>\n      <li style=\"font: 400 13px var(--m); padding: 8px 13px; border: 1px solid var(--rule); background: var(--paper); border-color: #E4DDD0\">GitHub<\u002Fli>\n      <li style=\"font: 400 13px var(--m); padding: 8px 13px; border: 1px solid var(--ink); background-color: #FFFDF9; border-color: #E4DDD0\">HTML / CSS<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"timeline\" style=\"padding:clamp(48px,6vw,80px) clamp(20px,5vw,64px);border-top:1px solid var(--rule);background:var(--paper)\">\n  <div style=\"max-width:1120px;margin:0 auto\">\n    <p style=\"margin:0 0 24px;font:400 11px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Timeline<\u002Fp>\n    <ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0;border-top:1px solid var(--rule)\">\n      <li style=\"display:grid;grid-template-columns:minmax(96px,120px) 1fr;gap:10px 20px;padding:14px 0;border-bottom:1px solid var(--rule)\"><span style=\"font:400 12px var(--m);color:var(--ac)\">2024–2026<\u002Fspan><span><strong style=\"font:500 16.5px var(--s)\">Mozilla Data Collective<\u002Fstrong><span style=\"color:var(--mid)\"> / Senior UX Designer. Design system, landing pages, LLM assistant.<\u002Fspan><\u002Fspan><\u002Fli>\n      <li style=\"display:grid;grid-template-columns:minmax(96px,120px) 1fr;gap:10px 20px;padding:14px 0;border-bottom:1px solid var(--rule)\"><span style=\"font:400 12px var(--m);color:var(--ac)\">2023–2024<\u002Fspan><span><strong style=\"font:500 16.5px var(--s)\">Indeed<\u002Fstrong><span style=\"color:var(--mid)\"> / UX research and design. 100+ interviews and usability tests.<\u002Fspan><\u002Fspan><\u002Fli>\n      <li style=\"display:grid;grid-template-columns:minmax(96px,120px) 1fr;gap:10px 20px;padding:14px 0;border-bottom:1px solid var(--rule)\"><span style=\"font:400 12px var(--m);color:var(--ac)\">2023<\u002Fspan><span><strong style=\"font:500 16.5px var(--s)\">McGraw-Hill ALEKS<\u002Fstrong><span style=\"color:var(--mid)\"> / First contextual inquiry. Usability score 73 to 82.<\u002Fspan><\u002Fspan><\u002Fli>\n      <li style=\"display:grid;grid-template-columns:minmax(96px,120px) 1fr;gap:10px 20px;padding:14px 0;border-bottom:1px solid var(--rule)\"><span style=\"font:400 12px var(--m);color:var(--ac)\">2022<\u002Fspan><span><strong style=\"font:500 16.5px var(--s)\">UC Santa Cruz MISFITS Lab<\u002Fstrong><span style=\"color:var(--mid)\"> / Research on accessible interaction.<\u002Fspan><\u002Fspan><\u002Fli>\n      <li style=\"display:grid;grid-template-columns:minmax(96px,120px) 1fr;gap:10px 20px;padding:14px 0;border-bottom:1px solid var(--rule)\"><span style=\"font:400 12px var(--m);color:var(--ac)\">2022<\u002Fspan><span><strong style=\"font:500 16.5px var(--s)\">DCO Media<\u002Fstrong><span style=\"color:var(--mid)\"> / Product and marketing design.<\u002Fspan><\u002Fspan><\u002Fli>\n      <li style=\"display:grid;grid-template-columns:minmax(96px,120px) 1fr;gap:10px 20px;padding:14px 0;border-bottom:1px solid var(--rule)\"><span style=\"font:400 12px var(--m);color:var(--ac)\">2015–2022<\u002Fspan><span><strong style=\"font:500 16.5px var(--s)\">hrsimple.com / ACCR<\u002Fstrong><span style=\"color:var(--mid)\"> / Every landing page, 10,000 paying clients, accessibility audits.<\u002Fspan><\u002Fspan><\u002Fli>\n      <li style=\"display:grid;grid-template-columns:minmax(96px,120px) 1fr;gap:10px 20px;padding:14px 0;border-bottom:1px solid var(--rule)\"><span style=\"font:400 12px var(--m);color:var(--ac)\">M.S.<\u002Fspan><span><strong style=\"font:500 16.5px var(--s)\">Human-Computer Interaction<\u002Fstrong><span style=\"color:var(--mid)\"> / UC Santa Cruz.<\u002Fspan><\u002Fspan><\u002Fli>\n      <li style=\"display:grid;grid-template-columns:minmax(96px,120px) 1fr;gap:10px 20px;padding:14px 0;border-bottom:1px solid var(--rule)\"><span style=\"font:400 12px var(--m);color:var(--ac)\">B.A.<\u002Fspan><span><strong style=\"font:500 16.5px var(--s)\">Philosophy<\u002Fstrong><span style=\"color:var(--mid)\"> / UCLA.<\u002Fspan><\u002Fspan><\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" style=\"padding:clamp(56px,8vw,110px) clamp(20px,5vw,64px);border-top:1px solid var(--rule)\">\n  <div style=\"max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(28px,4vw,56px);align-items:start\">\n    <div>\n      <h2 style=\"margin:0;max-width:22ch;font:400 clamp(28px,4vw,52px)/1.05 var(--d);letter-spacing:-.022em;text-wrap:balance\">I would like to do this work on Career Sites.<\u002Fh2>\n      <p style=\"margin:22px 0 0;max-width:56ch;font-size:18px;line-height:1.6;color:var(--mid);text-wrap:pretty\">Employers telling their own brand story, at parent and child level, through a component system that holds together across every site built on it. That is the same problem I have been solving for the last two years, inside the same kind of CMS limits. I work quietly, take the backlog as it comes, and leave things documented. If it would help to walk through any of this live, I am easy to reach.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:0;border-top:1px solid var(--ink)\">\n      <a href=\"mailto:jmgrant702@icloud.com\" style=\"display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:15px 2px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)\" style-hover=\"background:var(--acs)\"><span style=\"font:400 10px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)\">Email<\u002Fspan><span style=\"font:500 16px var(--s)\">jmgrant702@icloud.com<\u002Fspan><\u002Fa>\n      <a href=\"tel:+18477325241\" style=\"display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:15px 2px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)\" style-hover=\"background:var(--acs)\"><span style=\"font:400 10px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)\">Phone<\u002Fspan><span style=\"font:500 16px var(--s)\">+1 847 732 5241<\u002Fspan><\u002Fa>\n      \n      <p style=\"margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:15px 2px\"><span style=\"font:400 10px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)\">Based in<\u002Fspan><span style=\"font:500 16px var(--s)\">Glendale, CA<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<footer style=\"padding:26px clamp(20px,5vw,64px) 40px;border-top:1px solid var(--rule);background:var(--paper)\">\n  <div style=\"max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 28px;align-items:baseline;font:400 11.5px/1.6 var(--m);color:var(--soft)\">\n    <span>Justin Grant / Senior UX Designer / 2026<\u002Fspan>\n    <span style=\"flex:1 1 40px\"><\u002Fspan>\n    <span>Built from 6 components: stat tile, case card, pull quote, image caption, tag, section rule.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3d4f7a&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#7a5c12&quot;,&quot;#8a4326&quot;,&quot;#2f5d4f&quot;,&quot;#3d4f7a&quot;,&quot;#6b3a5c&quot;],&quot;section&quot;:&quot;Theme&quot;},&quot;scrollReveal&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;stickyNav&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() { this.sync(); }\n  componentDidUpdate() { this.sync(); }\n  componentWillUnmount() { if (this._io) this._io.disconnect(); }\n\n  sync() {\n    const root = document.documentElement;\n    if (this.props.accent) root.style.setProperty('--accent', this.props.accent);\n    else root.style.removeProperty('--accent');\n\n    const nav = document.getElementById('nav');\n    if (nav) nav.style.position = this.props.stickyNav === false ? 'static' : 'sticky';\n\n    this.applyReveal();\n  }\n\n  applyReveal() {\n    const els = Array.prototype.slice.call(document.querySelectorAll('[data-reveal]'));\n    if (!els.length) return;\n    const off = this.props.scrollReveal === false ||\n      (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);\n    if (this._io) { this._io.disconnect(); this._io = null; }\n    if (off) {\n      els.forEach(el => { el.style.opacity = ''; el.style.transform = ''; el.style.transition = ''; });\n      return;\n    }\n    this._io = new IntersectionObserver(entries => {\n      entries.forEach(e => {\n        if (!e.isIntersecting) return;\n        e.target.style.opacity = '1';\n        e.target.style.transform = 'none';\n        this._io.unobserve(e.target);\n      });\n    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.06 });\n    els.forEach(el => {\n      const seen = el.getBoundingClientRect().top < window.innerHeight * 0.9;\n      el.style.transition = 'opacity .55s ease, transform .55s cubic-bezier(.2,.7,.3,1)';\n      if (seen) { el.style.opacity = '1'; el.style.transform = 'none'; return; }\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(14px)';\n      this._io.observe(el);\n    });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
