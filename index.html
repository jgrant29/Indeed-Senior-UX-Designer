document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ase-02\" style=\"font:500 13.5px var(--s);color:var(--mid);text-decoration:none\" style-hover=\"color:var(--ink)\">Landing pages<\u002Fa>\n    <a href=\"#case-03\" style=\"font:500 13.5px var(--s);color:var(--mid);text-decoration:none\" style-hover=\"color:var(--ink)\">AI interfaces<\u002Fa>\n    <a href=\"#case-04\" style=\"font:500 13.5px var(--s);color:var(--mid);text-decoration:none\" style-hover=\"color:var(--ink)\">Accessibility<\u002Fa>\n    <a href=\"mailto:jmgrant702@icloud.com\" style=\"font:500 13.5px var(--s);color:var(--ac);text-decoration:none;border-bottom:1px solid var(--acl)\">Email<\u002Fa>\n  <\u002Fnav>\n<\u002Fheader>\n\n<main>\n\n<section id=\"hero\" style=\"padding:clamp(52px,8vw,104px) clamp(20px,5vw,64px) clamp(36px,5vw,64px)\">\n  <div style=\"max-width:1120px;margin:0 auto\">\n    <p style=\"margin:0 0 clamp(22px,3vw,34px);display:flex;align-items:center;gap:9px;font:400 11px/1 var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--ac)\">\n      <span aria-hidden=\"true\" style=\"width: 7px; height: 7px; border-radius: 50%; background: var(--ac);\"><\u002Fspan>\n      Currently open to work\n    <\u002Fp>\n    <h1 style=\"margin:0;max-width:20ch;font:400 clamp(40px,7.4vw,88px)/0.99 var(--d);letter-spacing:-.022em;text-wrap:balance\">I build the components other people ship with, and the pages that make people click.<\u002Fh1>\n    <p style=\"margin:clamp(24px,3vw,34px) 0 0;display:flex;flex-wrap:wrap;gap:8px 14px;font:400 11.5px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--mid)\">\n      <span>Design systems<\u002Fspan><span aria-hidden=\"true\" style=\"color:var(--acl)\">/<\u002Fspan>\n      <span>COMPONENTS<\u002Fspan><span aria-hidden=\"true\" style=\"color:var(--acl)\">/<\u002Fspan><span>ACCESSIBLITY<\u002Fspan><span aria-hidden=\"true\" style=\"color:var(--acl)\">/<\u002Fspan>\n      <span>MOBILE-FIRST<\u002Fspan><span aria-hidden=\"true\" style=\"color:var(--acl)\">/<\u002Fspan><span>Landing pages<\u002Fspan><span aria-hidden=\"true\" style=\"color:var(--acl)\">/<\u002Fspan><span>Shipped in production<\u002Fspan>\n    <\u002Fp>\n    <div style=\"margin-top:clamp(28px,4vw,44px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(20px,3vw,48px);align-items:start\">\n      <p style=\"margin:0;max-width:56ch;font-size:19px;line-height:1.6;color:var(--mid);text-wrap:pretty\">Eight-plus years in product and UX design. I build modular component libraries, design the marketing and landing pages that sit on top of them, and ship inside real CMS and engineering limits. I led sales and operations for a decade first, then went back for a master's in Human-Computer Interaction. I have also shipped production code, which is why constraints feel like home instead of friction.<\u002Fp>\n      <nav aria-label=\"Case studies\" style=\"display:flex;flex-direction:column;gap:0;border-top:1px solid var(--rule)\">\n        <a href=\"#case-01\" style=\"display:flex;gap:14px;align-items:baseline;padding:13px 2px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)\" style-hover=\"background:var(--acs)\"><span style=\"font:400 10px var(--m);color:var(--soft)\">01<\u002Fspan><span style=\"font:500 15px var(--s);flex:1\">Building the system, not just the screens<\u002Fspan><span aria-hidden=\"true\" style=\"color:var(--acl)\">→<\u002Fspan><\u002Fa>\n        <a href=\"#case-02\" style=\"display:flex;gap:14px;align-items:baseline;padding:13px 2px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)\" style-hover=\"background:var(--acs)\"><span style=\"font:400 10px var(--m);color:var(--soft)\">02<\u002Fspan><span style=\"font:500 15px var(--s);flex:1\">Landing pages that had to convert<\u002Fspan><span aria-hidden=\"true\" style=\"color:var(--acl)\">→<\u002Fspan><\u002Fa>\n        <a href=\"#case-03\" style=\"display:flex;gap:14px;align-items:baseline;padding:13px 2px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)\" style-hover=\"background:var(--acs)\"><span style=\"font:400 10px var(--m);color:var(--soft)\">03<\u002Fspan><span style=\"font:500 15px var(--s);flex:1\">Designing for a machine that talks back<\u002Fspan><span aria-hidden=\"true\" style=\"color:var(--acl)\">→<\u002Fspan><\u002Fa>\n        <a href=\"#case-04\" style=\"display:flex;gap:14px;align-items:baseline;padding:13px 2px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)\" style-hover=\"background:var(--acs)\"><span style=\"font:400 10px var(--m);color:var(--soft)\">04<\u002Fspan><span style=\"font:500 15px var(--s);flex:1\">Accessibility is not a checklist<\u002Fspan><span aria-hidden=\"true\" style=\"color:var(--acl)\">→<\u002Fspan><\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n\n    <figure data-reveal=\"\" style=\"margin:clamp(34px,5vw,64px) 0 0;display:flex;flex-direction:column;gap:11px\">\n      <div role=\"img\" aria-label=\"Wide collage placeholder: a Figma component library panel on the left beside a live browser window showing a marketing page on the right, suggesting design to production.\" style=\"display:grid;grid-template-columns:minmax(180px,1fr) minmax(240px,2.1fr);gap:10px;padding:10px;background:var(--paper);border:1px solid var(--rule)\">\n        <div style=\"background:#f4efe5;border:1px solid var(--rule);padding:10px;display:flex;flex-direction:column;gap:7px;min-height:210px\">\n          <span style=\"font:400 9.5px/1 var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--soft)\">Component library<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <div style=\"height:9px;width:72%;background:#e2dacb\"><\u002Fdiv>\n            <div style=\"height:9px;width:54%;background:#e2dacb\"><\u002Fdiv>\n            <div style=\"height:9px;width:64%;background:var(--acs);border-left:3px solid var(--acl)\"><\u002Fdiv>\n            <div style=\"height:9px;width:44%;background:#e2dacb\"><\u002Fdiv>\n            <div style=\"height:9px;width:58%;background:#e2dacb\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px\">\n            <div style=\"aspect-ratio:1;background:#fff;border:1px solid var(--rule)\"><\u002Fdiv>\n            <div style=\"aspect-ratio:1;background:#fff;border:1px solid var(--rule)\"><\u002Fdiv>\n            <div style=\"aspect-ratio:1;background:#fff;border:1px dashed var(--acl)\"><\u002Fdiv>\n            <div style=\"aspect-ratio:1;background:#fff;border:1px solid var(--rule)\"><\u002Fdiv>\n            <div style=\"aspect-ratio:1;background:#fff;border:1px solid var(--rule)\"><\u002Fdiv>\n            <div style=\"aspect-ratio:1;background:#fff;border:1px solid var(--rule)\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--rule);background:#fff;display:flex;flex-direction:column;overflow:hidden\">\n          <div style=\"display:flex;align-items:center;gap:7px;padding:7px 9px;background:#f4efe5;border-bottom:1px solid var(--rule)\">\n            <span aria-hidden=\"true\" style=\"width:7px;height:7px;border-radius:50%;background:#ded5c5\"><\u002Fspan>\n            <span aria-hidden=\"true\" style=\"width:7px;height:7px;border-radius:50%;background:#ded5c5\"><\u002Fspan>\n            <span aria-hidden=\"true\" style=\"width:7px;height:7px;border-radius:50%;background:#ded5c5\"><\u002Fspan>\n            <span style=\"flex:1;height:13px;background:#fff;border:1px solid var(--rule)\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;padding:18px;display:flex;flex-direction:column;gap:10px;background-image:repeating-linear-gradient(135deg,rgba(28,26,23,.045) 0 1px,transparent 1px 8px)\">\n            <div style=\"height:20px;width:58%;background:#ece5d8\"><\u002Fdiv>\n            <div style=\"height:9px;width:76%;background:#efe9dd\"><\u002Fdiv>\n            <div style=\"height:9px;width:66%;background:#efe9dd\"><\u002Fdiv>\n            <div style=\"height:26px;width:120px;background:var(--ac)\"><\u002Fdiv>\n            <div style=\"margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px\">\n              <div style=\"height:46px;background:#fff;border:1px solid var(--rule)\"><\u002Fdiv>\n              <div style=\"height:46px;background:#fff;border:1px solid var(--rule)\"><\u002Fdiv>\n              <div style=\"height:46px;background:#fff;border:1px solid var(--rule)\"><\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"align-self:flex-end;font:400 9.5px/1 var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--soft)\">Live page in production<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Placeholder: the library on the left is what ships on the right. Same tokens, same components, one design language.<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section aria-label=\"Proof in numbers\" style=\"padding:clamp(30px,4vw,48px) clamp(20px,5vw,64px);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--paper)\">\n  <div style=\"max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:clamp(18px,2.5vw,30px)\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;padding-left:14px;border-left:2px solid var(--acl)\">\n      <span style=\"font:500 clamp(32px,3.6vw,46px)/1 var(--d);letter-spacing:-.02em\">480+<\u002Fspan>\n      <span style=\"font-size:14.5px;line-height:1.45;color:var(--mid)\">components governed in one design system<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:6px;padding-left:14px;border-left:2px solid var(--acl)\">\n      <span style=\"font:500 clamp(32px,3.6vw,46px)/1 var(--d);letter-spacing:-.02em\">360+<\u002Fspan>\n      <span style=\"font-size:14.5px;line-height:1.45;color:var(--mid)\">responsive design tokens<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:6px;padding-left:14px;border-left:2px solid var(--acl)\">\n      <span style=\"font:500 clamp(32px,3.6vw,46px)/1 var(--d);letter-spacing:-.02em\">$13M<\u002Fspan>\n      <span style=\"font-size:14.5px;line-height:1.45;color:var(--mid)\">funding supported by a two-day-sprint landing page<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:6px;padding-left:14px;border-left:2px solid var(--acl)\">\n      <span style=\"font:500 clamp(32px,3.6vw,46px)/1 var(--d);letter-spacing:-.02em\">#1<\u002Fspan>\n      <span style=\"font-size:14.5px;line-height:1.45;color:var(--mid)\">organic search placements driven by SEO-aware design<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:6px;padding-left:14px;border-left:2px solid var(--acl)\">\n      <span style=\"font:500 clamp(32px,3.6vw,46px)/1 var(--d);letter-spacing:-.02em\">10,000<\u002Fspan>\n      <span style=\"font-size:14.5px;line-height:1.45;color:var(--mid)\">paying clients served by a product I designed and built<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<article id=\"case-01\" style=\"padding:clamp(56px,8vw,110px) clamp(20px,5vw,64px)\">\n  <div style=\"max-width:1120px;margin:0 auto\">\n    <p style=\"margin:0 0 16px;font:400 11px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Case study 01<\u002Fp>\n    <h2 style=\"margin:0;max-width:26ch;font:400 clamp(30px,4.6vw,58px)/1.03 var(--d);letter-spacing:-.02em;text-wrap:balance\">Building the system, not just the screens<\u002Fh2>\n    <p style=\"margin:14px 0 0;font:400 12.5px/1.5 var(--m);color:var(--ac)\">Mozilla Data Collective / Senior UX Designer / Apr 2024 to Aug 2026<\u002Fp>\n\n    <div data-reveal=\"\" style=\"margin-top:clamp(34px,4.5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(24px,3vw,40px)\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <h3 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">The situation<\u002Fh3>\n        <p style=\"margin:0;color:var(--mid);text-wrap:pretty\">A brand-new AI data platform with no design system and no other designer. I was it. Product, marketing pages, and the library itself all landed on one desk.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <h3 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">The problem<\u002Fh3>\n        <p style=\"margin:0;color:var(--mid);text-wrap:pretty\">Every feature invented its own components. I ran an audit and found the damage: 443 component sets scattered across 20+ pages, auto-generated names like <span style=\"font:400 13px var(--m);background:var(--acs);padding:1px 5px\">Frame 1321323387<\u002Fspan>, heavy duplication, no elevation tokens, and semantic tokens locked to a single mode.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <h3 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">What I did<\u002Fh3>\n        <p style=\"margin:0;color:var(--mid);text-wrap:pretty\">Built net-new components into a modular library using component sets, variants, and Auto Layout. Established design tokens with responsive modes for desktop, tablet, and mobile. Set theming and branding rules so parent and child brand expressions stayed one design language instead of drifting apart.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <h3 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">The constraint that shaped everything<\u002Fh3>\n        <p style=\"margin:0;color:var(--mid);text-wrap:pretty\">I designed within the technical limits of the CMS, working directly with platform engineers, so nothing shipped that could not actually be built. The library was scoped to what the platform could render, not to what looked good in a Figma frame.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p data-reveal=\"\" style=\"margin:clamp(30px,4vw,48px) 0 0;padding:22px 0 0;border-top:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:10px 34px;font:400 14.5px var(--s);color:var(--ink)\">\n      <span><strong style=\"font:500 20px var(--d)\">480+<\u002Fstrong> components<\u002Fspan>\n      <span><strong style=\"font:500 20px var(--d)\">360+<\u002Fstrong> tokens<\u002Fspan>\n      <span><strong style=\"font:500 20px var(--d)\">3<\u002Fstrong> responsive modes<\u002Fspan>\n      <span style=\"color:var(--ac)\">A system that survived my leaving it.<\u002Fspan>\n    <\u002Fp>\n\n    <div data-reveal=\"\" style=\"margin-top:clamp(34px,4.5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(22px,3vw,36px)\">\n\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n        <div role=\"img\" aria-label=\"Before and after audit board placeholder: chaotic auto-generated layer names on the left resolving into a clean, named component library on the right.\" style=\"background:var(--paper);border:1px solid var(--rule);padding:12px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font:400 9px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;color:#b4453a\">Before<\u002Fspan>\n            <div style=\"font:400 8.5px/1.9 var(--m);color:var(--soft);background:#f6f1e7;border:1px dashed #d8ccb6;padding:7px;overflow:hidden\">Frame 1321323387<br>Frame 88213 copy<br>Group 4 / Group 4<br>Rectangle 219<br>Frame 1321323391<br>btn-final-FINAL<br>Group 12 copy 3<\u002Fdiv>\n          <\u002Fdiv>\n          <span aria-hidden=\"true\" style=\"align-self:center;font:400 15px var(--m);color:var(--acl)\">→<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font:400 9px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--ac)\">After<\u002Fspan>\n            <div style=\"font:400 8.5px/1.9 var(--m);color:var(--mid);background:#fff;border:1px solid var(--rule);padding:7px;overflow:hidden\">Button / Primary<br>Button / Secondary<br>Card / Job listing<br>Hero / Campaign<br>Nav / Global<br>Token / Elevation<br>Section / Two column<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Component audit: 443 sets, most of them unnamed.<\u002Ffigcaption>\n      <\u002Ffigure>\n\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n        <div role=\"img\" aria-label=\"Variants matrix placeholder: a four by three grid of component variants with dashed Auto Layout spacing guides visible between them.\" style=\"background:var(--paper);border:1px solid var(--rule);padding:14px;display:flex;flex-direction:column;gap:9px\">\n          <div style=\"display:flex;gap:12px;font:400 9px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)\"><span style=\"width:52px\"><\u002Fspan><span>Default<\u002Fspan><span>Hover<\u002Fspan><span>Focus<\u002Fspan><span>Disabled<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:52px repeat(4,1fr);gap:9px;align-items:center\">\n            <span style=\"font:400 9px var(--m);color:var(--soft)\">Primary<\u002Fspan>\n            <div style=\"height:24px;background:var(--ac)\"><\u002Fdiv><div style=\"height:24px;background:#5f4710\"><\u002Fdiv><div style=\"height:24px;background:var(--ac);outline:2px solid var(--acl);outline-offset:2px\"><\u002Fdiv><div style=\"height:24px;background:#e0d8c8\"><\u002Fdiv>\n            <span style=\"font:400 9px var(--m);color:var(--soft)\">Ghost<\u002Fspan>\n            <div style=\"height:24px;border:1px solid var(--ink)\"><\u002Fdiv><div style=\"height:24px;border:1px solid var(--ink);background:var(--acs)\"><\u002Fdiv><div style=\"height:24px;border:1px solid var(--ink);outline:2px solid var(--acl);outline-offset:2px\"><\u002Fdiv><div style=\"height:24px;border:1px dashed #cdc4b3\"><\u002Fdiv>\n            <span style=\"font:400 9px var(--m);color:var(--soft)\">Link<\u002Fspan>\n            <div style=\"height:24px;border-bottom:1px solid var(--acl)\"><\u002Fdiv><div style=\"height:24px;border-bottom:2px solid var(--ink)\"><\u002Fdiv><div style=\"height:24px;border-bottom:1px solid var(--acl);outline:2px solid var(--acl);outline-offset:2px\"><\u002Fdiv><div style=\"height:24px;border-bottom:1px dashed #cdc4b3\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:2px;display:flex;align-items:center;gap:7px\"><span aria-hidden=\"true\" style=\"flex:1;height:1px;border-top:1px dashed var(--acl)\"><\u002Fspan><span style=\"font:400 9px var(--m);color:var(--acl)\">auto layout / gap 8<\u002Fspan><span aria-hidden=\"true\" style=\"flex:1;height:1px;border-top:1px dashed var(--acl)\"><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Every state defined once, in the variant, not redrawn per page.<\u002Ffigcaption>\n      <\u002Ffigure>\n\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n        <div role=\"img\" aria-label=\"Token table placeholder: rows of spacing and type tokens with separate value columns for desktop, tablet, and mobile modes.\" style=\"background:var(--paper);border:1px solid var(--rule);padding:14px;font:400 10px/1 var(--m);color:var(--mid)\">\n          <div style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--rule);color:var(--soft);letter-spacing:.06em;text-transform:uppercase;font-size:9px\"><span>Token<\u002Fspan><span>Desktop<\u002Fspan><span>Tablet<\u002Fspan><span>Mobile<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #efe9dd\"><span>space.section<\u002Fspan><span>112<\u002Fspan><span>80<\u002Fspan><span>56<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #efe9dd\"><span>type.display<\u002Fspan><span>88<\u002Fspan><span>64<\u002Fspan><span>40<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #efe9dd\"><span>grid.columns<\u002Fspan><span>12<\u002Fspan><span>8<\u002Fspan><span>4<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px;padding:9px 0;background:var(--acs)\"><span>elevation.card<\u002Fspan><span>02<\u002Fspan><span>02<\u002Fspan><span>01<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">360+ tokens, three modes. Mobile is a mode, not an afterthought.<\u002Ffigcaption>\n      <\u002Ffigure>\n\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n        <div role=\"img\" aria-label=\"Theming placeholder: the same page layout shown twice, once in a parent brand palette and once in a child brand palette.\" style=\"background:var(--paper);border:1px solid var(--rule);padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n          <div style=\"border:1px solid var(--rule);background:#fff;padding:10px;display:flex;flex-direction:column;gap:7px\">\n            <span style=\"font:400 9px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)\">Parent brand<\u002Fspan>\n            <div style=\"height:34px;background:var(--ink)\"><\u002Fdiv>\n            <div style=\"height:8px;width:80%;background:#ece5d8\"><\u002Fdiv>\n            <div style=\"height:8px;width:60%;background:#ece5d8\"><\u002Fdiv>\n            <div style=\"height:20px;width:74px;background:var(--ac)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--rule);background:#fff;padding:10px;display:flex;flex-direction:column;gap:7px\">\n            <span style=\"font:400 9px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)\">Child brand<\u002Fspan>\n            <div style=\"height:34px;background:#33495c\"><\u002Fdiv>\n            <div style=\"height:8px;width:80%;background:#e4e8ec\"><\u002Fdiv>\n            <div style=\"height:8px;width:60%;background:#e4e8ec\"><\u002Fdiv>\n            <div style=\"height:20px;width:74px;background:#4a7fa5\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Same components, same spacing, different brand. Theming rules do the work.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n\n    <blockquote data-reveal=\"\" style=\"margin:clamp(38px,5vw,64px) 0 0;padding:0 0 0 clamp(18px,3vw,34px);border-left:2px solid var(--ac);max-width:34ch\">\n      <p style=\"margin:0;font:400 clamp(23px,2.9vw,36px)/1.22 var(--d);letter-spacing:-.015em;text-wrap:pretty\">“A design system nobody can find is just a folder. I named things so the next designer could work without me.”<\u002Fp>\n    <\u002Fblockquote>\n  <\u002Fdiv>\n<\u002Farticle>\n\n<article id=\"case-02\" style=\"padding:clamp(56px,8vw,110px) clamp(20px,5vw,64px);border-top:1px solid var(--rule);background:var(--paper)\">\n  <div style=\"max-width:1120px;margin:0 auto\">\n    <p style=\"margin:0 0 16px;font:400 11px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Case study 02<\u002Fp>\n    <h2 style=\"margin:0;max-width:24ch;font:400 clamp(30px,4.6vw,58px)/1.03 var(--d);letter-spacing:-.02em;text-wrap:balance\">Landing pages that had to convert<\u002Fh2>\n    <p style=\"margin:14px 0 0;font:400 12.5px/1.5 var(--m);color:var(--ac)\">Mozilla Data Collective + hrsimple.com / Landing pages, campaign pages, SEO<\u002Fp>\n\n    <div data-reveal=\"\" style=\"margin-top:clamp(34px,4.5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:clamp(24px,3vw,40px)\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <h3 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">The two-day sprint<\u002Fh3>\n        <p style=\"margin:0;color:var(--mid);text-wrap:pretty\">An investor pitch page, designed and prototyped in 48 hours, that anchored the pitch and helped secure $13 million. Speed came from the system: components already existed, so the two days went into narrative, hierarchy, and proof, not into redrawing buttons.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <h3 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Common Voice redesign<\u002Fh3>\n        <p style=\"margin:0;color:var(--mid);text-wrap:pretty\">A landing page redesign that is live in production today, built around two conversion goals: get people to contribute, and get researchers to download the dataset. The page earns its keep on both.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <h3 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">hrsimple.com, every page<\u002Fh3>\n        <p style=\"margin:0;color:var(--mid);text-wrap:pretty\">I designed every landing page for an employment-law and HR-compliance e-commerce platform serving 10,000 paying clients: homepage, product, webinar, and campaign. Optimized for SEO, page performance, click-through, and conversion using Google Search Console, Lighthouse, and Analytics, earning #1 organic placements.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <h3 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Mobile parity, every time<\u002Fh3>\n        <p style=\"margin:0;color:var(--mid);text-wrap:pretty\">Every one of these pages was designed mobile-first and shipped with parity across breakpoints. The phone layout is drawn deliberately, with its own hierarchy and tap targets, rather than being the desktop page squeezed into 390 pixels.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" style=\"margin-top:clamp(34px,4.5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(22px,3vw,36px)\">\n\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px;grid-column:1/-1\">\n        <div role=\"img\" aria-label=\"Responsive triptych placeholder: the same landing page shown at desktop, tablet, and mobile widths side by side, with the layout reflowing from three columns to one.\" style=\"background:var(--bg);border:1px solid var(--rule);padding:14px;display:grid;grid-template-columns:2.2fr 1.2fr 0.62fr;gap:12px;align-items:end\">\n          <div style=\"border:1px solid var(--rule);background:#fff;padding:11px;display:flex;flex-direction:column;gap:8px;min-height:180px\">\n            <div style=\"height:15px;width:52%;background:#ece5d8\"><\u002Fdiv>\n            <div style=\"height:7px;width:70%;background:#f1ebdf\"><\u002Fdiv>\n            <div style=\"height:22px;width:96px;background:var(--ac)\"><\u002Fdiv>\n            <div style=\"margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px\"><div style=\"height:44px;background:#f6f1e7\"><\u002Fdiv><div style=\"height:44px;background:#f6f1e7\"><\u002Fdiv><div style=\"height:44px;background:#f6f1e7\"><\u002Fdiv><\u002Fdiv>\n            <span style=\"font:400 9px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)\">1440<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--rule);background:#fff;padding:9px;display:flex;flex-direction:column;gap:7px;min-height:150px\">\n            <div style=\"height:13px;width:62%;background:#ece5d8\"><\u002Fdiv>\n            <div style=\"height:7px;width:84%;background:#f1ebdf\"><\u002Fdiv>\n            <div style=\"height:20px;width:78px;background:var(--ac)\"><\u002Fdiv>\n            <div style=\"margin-top:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:7px\"><div style=\"height:38px;background:#f6f1e7\"><\u002Fdiv><div style=\"height:38px;background:#f6f1e7\"><\u002Fdiv><\u002Fdiv>\n            <span style=\"font:400 9px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)\">768<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--rule);background:#fff;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:124px\">\n            <div style=\"height:11px;width:78%;background:#ece5d8\"><\u002Fdiv>\n            <div style=\"height:6px;width:92%;background:#f1ebdf\"><\u002Fdiv>\n            <div style=\"height:18px;width:100%;background:var(--ac)\"><\u002Fdiv>\n            <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:6px\"><div style=\"height:26px;background:#f6f1e7\"><\u002Fdiv><div style=\"height:26px;background:#f6f1e7\"><\u002Fdiv><\u002Fdiv>\n            <span style=\"font:400 9px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)\">390<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">One page, three deliberate layouts. The mobile call to action is full width because thumbs are.<\u002Ffigcaption>\n      <\u002Ffigure>\n\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n        <div role=\"img\" aria-label=\"Lighthouse score panel placeholder: four circular scores for performance, accessibility, best practices, and SEO, all in the high nineties.\" style=\"background:var(--bg);border:1px solid var(--rule);padding:18px;display:flex;justify-content:space-around;gap:10px;flex-wrap:wrap\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:7px\"><span style=\"width:52px;height:52px;border-radius:50%;border:3px solid var(--acl);display:grid;place-items:center;font:700 16px var(--m);color:var(--ink)\">98<\u002Fspan><span style=\"font:400 8.5px/1 var(--m);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)\">Perf<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:7px\"><span style=\"width:52px;height:52px;border-radius:50%;border:3px solid var(--acl);display:grid;place-items:center;font:700 16px var(--m);color:var(--ink)\">100<\u002Fspan><span style=\"font:400 8.5px/1 var(--m);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)\">A11y<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:7px\"><span style=\"width:52px;height:52px;border-radius:50%;border:3px solid var(--acl);display:grid;place-items:center;font:700 16px var(--m);color:var(--ink)\">96<\u002Fspan><span style=\"font:400 8.5px/1 var(--m);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)\">Best pr.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:7px\"><span style=\"width:52px;height:52px;border-radius:50%;border:3px solid var(--acl);display:grid;place-items:center;font:700 16px var(--m);color:var(--ink)\">100<\u002Fspan><span style=\"font:400 8.5px/1 var(--m);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)\">SEO<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Placeholder for a real Lighthouse panel. Performance is a design decision too.<\u002Ffigcaption>\n      <\u002Ffigure>\n\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n        <div role=\"img\" aria-label=\"Search Console chart placeholder: a bar chart of organic impressions climbing steadily left to right toward a number one placement marker.\" style=\"background:var(--bg);border:1px solid var(--rule);padding:16px 16px 12px;display:flex;flex-direction:column;gap:9px\">\n          <div style=\"display:flex;align-items:flex-end;gap:6px;height:110px\">\n            <div style=\"flex:1;height:22%;background:#e6dfd1\"><\u002Fdiv><div style=\"flex:1;height:30%;background:#e6dfd1\"><\u002Fdiv><div style=\"flex:1;height:27%;background:#e6dfd1\"><\u002Fdiv><div style=\"flex:1;height:41%;background:#ddd3bf\"><\u002Fdiv><div style=\"flex:1;height:52%;background:#ddd3bf\"><\u002Fdiv><div style=\"flex:1;height:48%;background:#ddd3bf\"><\u002Fdiv><div style=\"flex:1;height:66%;background:var(--acl)\"><\u002Fdiv><div style=\"flex:1;height:79%;background:var(--acl)\"><\u002Fdiv><div style=\"flex:1;height:88%;background:var(--ac)\"><\u002Fdiv><div style=\"flex:1;height:100%;background:var(--ac)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;font:400 9px/1 var(--m);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)\"><span>Impressions, 10 months<\u002Fspan><span style=\"color:var(--ac)\">#1 placement<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Search Console over ten months. Headings, copy, and speed all moved this line.<\u002Ffigcaption>\n      <\u002Ffigure>\n\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px;grid-column:1/-1\">\n        <div role=\"img\" aria-label=\"Progression strip placeholder: four frames showing one campaign page moving from sketch to wireframe to high fidelity to shipped page.\" style=\"background:var(--bg);border:1px solid var(--rule);padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px\">\n          <div style=\"border:1px dashed #cdc4b3;background:#fff;padding:9px;display:flex;flex-direction:column;gap:6px;min-height:120px\"><span style=\"font:400 8.5px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)\">01 Sketch<\u002Fspan><div style=\"height:9px;width:56%;background:#efe9dd\"><\u002Fdiv><div style=\"height:5px;width:80%;background:#f4efe5\"><\u002Fdiv><div style=\"height:5px;width:72%;background:#f4efe5\"><\u002Fdiv><div style=\"margin-top:auto;height:14px;width:54px;border:1px dashed #cdc4b3\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--rule);background:#fff;padding:9px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:400 8.5px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)\">02 Wireframe<\u002Fspan><div style=\"height:11px;width:62%;background:#e9e2d4\"><\u002Fdiv><div style=\"height:5px;width:86%;background:#f1ebdf\"><\u002Fdiv><div style=\"height:5px;width:74%;background:#f1ebdf\"><\u002Fdiv><div style=\"margin-top:auto;height:16px;width:62px;background:#ddd3bf\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--rule);background:#fff;padding:9px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:400 8.5px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)\">03 Hi-fi<\u002Fspan><div style=\"height:13px;width:66%;background:var(--ink)\"><\u002Fdiv><div style=\"height:5px;width:88%;background:#ece5d8\"><\u002Fdiv><div style=\"height:5px;width:70%;background:#ece5d8\"><\u002Fdiv><div style=\"margin-top:auto;height:18px;width:70px;background:var(--acl)\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--ink);background:#fff;padding:9px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:400 8.5px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--ac)\">04 Shipped<\u002Fspan><div style=\"height:13px;width:70%;background:var(--ink)\"><\u002Fdiv><div style=\"height:5px;width:90%;background:#ece5d8\"><\u002Fdiv><div style=\"height:5px;width:76%;background:#ece5d8\"><\u002Fdiv><div style=\"margin-top:auto;height:18px;width:76px;background:var(--ac)\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Forty-eight hours, four states. Nothing here was invented twice.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n\n    <blockquote data-reveal=\"\" style=\"margin:clamp(38px,5vw,64px) 0 0;padding:0 0 0 clamp(18px,3vw,34px);border-left:2px solid var(--ac);max-width:34ch\">\n      <p style=\"margin:0;font:400 clamp(23px,2.9vw,36px)/1.22 var(--d);letter-spacing:-.015em;text-wrap:pretty\">“Marketing pages are where design meets the P&amp;L. I design them like the number at the end matters.”<\u002Fp>\n    <\u002Fblockquote>\n  <\u002Fdiv>\n<\u002Farticle>\n\n<article id=\"case-03\" style=\"padding:clamp(56px,8vw,110px) clamp(20px,5vw,64px);border-top:1px solid var(--rule)\">\n  <div style=\"max-width:1120px;margin:0 auto\">\n    <p style=\"margin:0 0 16px;font:400 11px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Case study 03<\u002Fp>\n    <h2 style=\"margin:0;max-width:24ch;font:400 clamp(30px,4.6vw,58px)/1.03 var(--d);letter-spacing:-.02em;text-wrap:balance\">Designing for a machine that talks back<\u002Fh2>\n    <p style=\"margin:14px 0 0;font:400 12.5px/1.5 var(--m);color:var(--ac)\">Mozilla Data Collective / LLM data assistant + Spontaneous Speech<\u002Fp>\n\n    <div data-reveal=\"\" style=\"margin-top:clamp(34px,4.5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:clamp(24px,3vw,40px)\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <h3 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Conversational UX<\u002Fh3>\n        <p style=\"margin:0;color:var(--mid);text-wrap:pretty\">Prompt entry, response states, and error handling for an LLM data assistant. The hard part was not the happy path. It was deciding what to show a person when the model is uncertain, partially right, or wrong, and doing it without eroding trust in the data underneath.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <h3 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Spontaneous Speech<\u002Fh3>\n        <p style=\"margin:0;color:var(--mid);text-wrap:pretty\">A contribution experience for Common Voice that captured 357+ hours of speech across 51 languages. Mobile-first, because that is where contributors actually are, and forgiving, because recording your own voice makes people self-conscious.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <h3 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">AI as a design tool<\u002Fh3>\n        <p style=\"margin:0;color:var(--mid);text-wrap:pretty\">I prototype daily with Claude, Claude Code, Cursor, and Figma AI: exploring landing page directions, building out the system, and getting to something testable in hours. This portfolio was built that way, in code, from a written brief.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" style=\"margin-top:clamp(34px,4.5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(22px,3vw,36px)\">\n\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px;grid-column:1/-1\">\n        <div role=\"img\" aria-label=\"Chatbot states placeholder: four stacked panels showing the assistant empty, thinking, answering with a cited source, and in an error state with a recovery action.\" style=\"background:var(--paper);border:1px solid var(--rule);padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px\">\n          <div style=\"border:1px solid var(--rule);background:#fff;padding:10px;display:flex;flex-direction:column;gap:7px;min-height:132px\"><span style=\"font:400 8.5px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)\">Empty<\u002Fspan><div style=\"height:6px;width:60%;background:#f1ebdf\"><\u002Fdiv><div style=\"margin-top:auto;height:26px;border:1px solid var(--rule);display:flex;align-items:center;padding:0 7px\"><span style=\"font:400 8px var(--m);color:#b9b1a5\">Ask about the dataset<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--rule);background:#fff;padding:10px;display:flex;flex-direction:column;gap:7px\"><span style=\"font:400 8.5px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)\">Thinking<\u002Fspan><div style=\"align-self:flex-end;height:20px;width:66%;background:var(--acs)\"><\u002Fdiv><div style=\"display:flex;gap:4px\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--acl)\"><\u002Fspan><span style=\"width:6px;height:6px;border-radius:50%;background:#ddd3bf\"><\u002Fspan><span style=\"width:6px;height:6px;border-radius:50%;background:#ece5d8\"><\u002Fspan><\u002Fdiv><div style=\"margin-top:auto;height:26px;border:1px solid var(--rule)\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--rule);background:#fff;padding:10px;display:flex;flex-direction:column;gap:7px\"><span style=\"font:400 8.5px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)\">Answering<\u002Fspan><div style=\"align-self:flex-end;height:16px;width:56%;background:var(--acs)\"><\u002Fdiv><div style=\"height:5px;width:92%;background:#ece5d8\"><\u002Fdiv><div style=\"height:5px;width:84%;background:#ece5d8\"><\u002Fdiv><div style=\"height:5px;width:64%;background:#ece5d8\"><\u002Fdiv><div style=\"margin-top:auto;font:400 8px var(--m);color:var(--ac);border-top:1px solid var(--rule);padding-top:6px\">source: 3 tables<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #d8b3a8;background:#fff;padding:10px;display:flex;flex-direction:column;gap:7px\"><span style=\"font:400 8.5px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:#a8452b\">Uncertain / error<\u002Fspan><div style=\"height:5px;width:88%;background:#f0e2dd\"><\u002Fdiv><div style=\"height:5px;width:70%;background:#f0e2dd\"><\u002Fdiv><div style=\"margin-top:auto;display:flex;gap:6px\"><span style=\"height:20px;flex:1;border:1px solid var(--ink)\"><\u002Fspan><span style=\"height:20px;flex:1;background:var(--ink)\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Four states, one component. The error state tells you what to do next, not just that something broke.<\u002Ffigcaption>\n      <\u002Ffigure>\n\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n        <div role=\"img\" aria-label=\"Mobile voice contribution flow placeholder: a phone-shaped frame with a prompt sentence, a waveform recording indicator, and large record and skip controls.\" style=\"background:var(--paper);border:1px solid var(--rule);padding:16px;display:grid;place-items:center\">\n          <div style=\"width:150px;border:1px solid var(--ink);border-radius:16px;background:#fff;padding:12px 10px;display:flex;flex-direction:column;gap:9px\">\n            <span style=\"align-self:center;width:34px;height:4px;border-radius:2px;background:#e4ddd0\"><\u002Fspan>\n            <span style=\"font:400 8px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)\">Speak this sentence<\u002Fspan>\n            <div style=\"height:6px;width:94%;background:#ece5d8\"><\u002Fdiv>\n            <div style=\"height:6px;width:72%;background:#ece5d8\"><\u002Fdiv>\n            <div style=\"display:flex;align-items:flex-end;gap:2px;height:34px;padding:6px 0\">\n              <span style=\"flex:1;height:30%;background:var(--acl)\"><\u002Fspan><span style=\"flex:1;height:62%;background:var(--acl)\"><\u002Fspan><span style=\"flex:1;height:100%;background:var(--ac)\"><\u002Fspan><span style=\"flex:1;height:74%;background:var(--acl)\"><\u002Fspan><span style=\"flex:1;height:44%;background:var(--acl)\"><\u002Fspan><span style=\"flex:1;height:86%;background:var(--ac)\"><\u002Fspan><span style=\"flex:1;height:52%;background:var(--acl)\"><\u002Fspan><span style=\"flex:1;height:26%;background:#ddd3bf\"><\u002Fspan><span style=\"flex:1;height:40%;background:#ddd3bf\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:44px;border-radius:22px;background:var(--ac)\"><\u002Fdiv>\n            <div style=\"height:32px;border-radius:16px;border:1px solid var(--rule)\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">357+ hours, 51 languages. Record and skip are both 44 pixels tall for a reason.<\u002Ffigcaption>\n      <\u002Ffigure>\n\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n        <div role=\"img\" aria-label=\"Split screen placeholder: a written prompt and generated code on the left, the resulting working page preview on the right.\" style=\"background:var(--paper);border:1px solid var(--rule);padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n          <div style=\"background:#22201d;padding:10px;display:flex;flex-direction:column;gap:5px;min-height:150px\">\n            <span style=\"font:400 8px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:#8b8378\">Prompt<\u002Fspan>\n            <div style=\"height:4px;width:88%;background:#4a453e\"><\u002Fdiv>\n            <div style=\"height:4px;width:70%;background:#4a453e\"><\u002Fdiv>\n            <span style=\"margin-top:6px;font:400 8px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--acl)\">Code<\u002Fspan>\n            <div style=\"height:4px;width:60%;background:#6b6152\"><\u002Fdiv>\n            <div style=\"height:4px;width:78%;background:#6b6152\"><\u002Fdiv>\n            <div style=\"height:4px;width:52%;background:#6b6152\"><\u002Fdiv>\n            <div style=\"height:4px;width:82%;background:#6b6152\"><\u002Fdiv>\n            <div style=\"height:4px;width:44%;background:#6b6152\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--rule);background:#fff;padding:10px;display:flex;flex-direction:column;gap:7px\">\n            <span style=\"font:400 8px/1 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)\">Working prototype<\u002Fspan>\n            <div style=\"height:12px;width:64%;background:#ece5d8\"><\u002Fdiv>\n            <div style=\"height:5px;width:86%;background:#f1ebdf\"><\u002Fdiv>\n            <div style=\"height:5px;width:74%;background:#f1ebdf\"><\u002Fdiv>\n            <div style=\"height:18px;width:70px;background:var(--ac)\"><\u002Fdiv>\n            <div style=\"margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px\"><div style=\"height:30px;background:#f6f1e7\"><\u002Fdiv><div style=\"height:30px;background:#f6f1e7\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Prompt to prototype in an afternoon, then test it with real people.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n\n    <blockquote data-reveal=\"\" style=\"margin:clamp(38px,5vw,64px) 0 0;padding:0 0 0 clamp(18px,3vw,34px);border-left:2px solid var(--ac);max-width:36ch\">\n      <p style=\"margin:0;font:400 clamp(23px,2.9vw,36px)/1.22 var(--d);letter-spacing:-.015em;text-wrap:pretty\">“AI does not replace the craft. It shortens the distance between an idea and something real enough to test.”<\u002Fp>\n    <\u002Fblockquote>\n  <\u002Fdiv>\n<\u002Farticle>\n\n<article id=\"case-04\" style=\"padding:clamp(56px,8vw,110px) clamp(20px,5vw,64px);border-top:1px solid var(--rule);background:var(--paper)\">\n  <div style=\"max-width:1120px;margin:0 auto\">\n    <p style=\"margin:0 0 16px;font:400 11px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Case study 04<\u002Fp>\n    <h2 style=\"margin:0;max-width:22ch;font:400 clamp(30px,4.6vw,58px)/1.03 var(--d);letter-spacing:-.02em;text-wrap:balance\">Accessibility is not a checklist<\u002Fh2>\n    <p style=\"margin:14px 0 0;font:400 12.5px/1.5 var(--m);color:var(--ac)\">hrsimple.com + ACM SIGDOC / WCAG and ADA audits, published research<\u002Fp>\n\n    <div data-reveal=\"\" style=\"margin-top:clamp(34px,4.5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:clamp(24px,3vw,40px)\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <h3 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Audited by hand, not just by tool<\u002Fh3>\n        <p style=\"margin:0;color:var(--mid);text-wrap:pretty\">Automated and manual WCAG and ADA audits, including NVDA screen reader testing alongside Google Lighthouse. Automation finds the missing label. Only a manual pass tells you the page reads as nonsense in order.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <h3 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Published research<\u002Fh3>\n        <p style=\"margin:0;color:var(--mid);text-wrap:pretty\">I co-founded an accessibility research initiative with universities and libraries, and published peer-reviewed work at ACM SIGDOC on accessibility and design-to-code practice.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <h3 style=\"margin:0;font:400 10.5px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Baked into components<\u002Fh3>\n        <p style=\"margin:0;color:var(--mid);text-wrap:pretty\">Accessible states, contrast ratios, and focus treatment live in the component, so every page assembled from the library inherits them. That is how accessibility scales across dozens of brand sites instead of being retrofitted one page at a time.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" style=\"margin-top:clamp(34px,4.5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(22px,3vw,36px)\">\n\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n        <div role=\"img\" aria-label=\"Specification sheet placeholder: rows showing focus ring treatment and contrast ratio pairs annotated with pass values.\" style=\"background:var(--bg);border:1px solid var(--rule);padding:14px;display:flex;flex-direction:column;gap:11px\">\n          <span style=\"font:400 9px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)\">Focus and contrast spec<\u002Fspan>\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:26px;width:88px;background:var(--ac);outline:2px solid var(--ink);outline-offset:3px\"><\u002Fspan><span style=\"font:400 9.5px var(--m);color:var(--mid)\">focus / 2px / offset 3<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;padding-top:6px\"><span style=\"height:26px;width:88px;border:1px solid var(--ink);background:#fff\"><\u002Fspan><span style=\"font:400 9.5px var(--m);color:var(--mid)\">ink on paper / 14.8:1<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:26px;width:88px;background:var(--acs);border:1px solid var(--acl)\"><\u002Fspan><span style=\"font:400 9.5px var(--m);color:var(--mid)\">accent text / 5.4:1 / AA<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:26px;width:88px;background:#e0d8c8\"><\u002Fspan><span style=\"font:400 9.5px var(--m);color:#a8452b\">disabled / not a state you can read / fail<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Contrast written into the spec, so nobody has to relitigate it in review.<\u002Ffigcaption>\n      <\u002Ffigure>\n\n      \n\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n        <div role=\"img\" aria-label=\"Paper cover placeholder: an ACM SIGDOC proceedings cover page with title, authors, and abstract lines.\" style=\"background:var(--bg);border:1px solid var(--rule);padding:16px;display:grid;place-items:center\">\n          <div style=\"width:100%;max-width:168px;aspect-ratio:3/4;background:#fff;border:1px solid var(--rule);padding:14px;display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font:400 8px/1 var(--m);letter-spacing:.09em;text-transform:uppercase;color:var(--ac)\">ACM SIGDOC<\u002Fspan>\n            <div style=\"height:8px;width:92%;background:#e9e2d4\"><\u002Fdiv>\n            <div style=\"height:8px;width:74%;background:#e9e2d4\"><\u002Fdiv>\n            <div style=\"height:4px;width:56%;background:#f1ebdf;margin-top:4px\"><\u002Fdiv>\n            <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:3px\"><div style=\"height:3px;width:100%;background:#f1ebdf\"><\u002Fdiv><div style=\"height:3px;width:96%;background:#f1ebdf\"><\u002Fdiv><div style=\"height:3px;width:100%;background:#f1ebdf\"><\u002Fdiv><div style=\"height:3px;width:88%;background:#f1ebdf\"><\u002Fdiv><div style=\"height:3px;width:94%;background:#f1ebdf\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font:400 12.5px/1.5 var(--m);color:var(--soft)\">Peer-reviewed work on accessibility and design-to-code.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Farticle>\n\n<section id=\"process\" style=\"padding:clamp(56px,8vw,110px) clamp(20px,5vw,64px);border-top:1px solid var(--rule)\">\n  <div style=\"max-width:1120px;margin:0 auto\">\n    <p style=\"margin:0 0 16px;font:400 11px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">How I work<\u002Fp>\n    <h2 style=\"margin:0;max-width:28ch;font:400 clamp(26px,3.6vw,44px)/1.06 var(--d);letter-spacing:-.02em;text-wrap:balance\">Six steps, in order, every time<\u002Fh2>\n    <div data-reveal=\"\" style=\"margin-top:clamp(30px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)\">\n      <div style=\"background:var(--bg);padding:18px;display:flex;flex-direction:column;gap:11px\">\n        <div aria-hidden=\"true\" style=\"height:42px;background:#fff;border:1px solid var(--rule);display:flex;align-items:center;gap:5px;padding:0 9px\"><span style=\"width:5px;height:22px;background:var(--acl)\"><\u002Fspan><span style=\"flex:1;height:5px;background:#ece5d8\"><\u002Fspan><\u002Fdiv>\n        <h3 style=\"margin:0;font:500 15px var(--s)\"><span style=\"font:400 10px var(--m);color:var(--soft);margin-right:7px\">01<\u002Fspan>Frame the problem<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:var(--mid)\">Agree on what we are solving and how we will know it worked, before anything gets drawn.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--bg);padding:18px;display:flex;flex-direction:column;gap:11px\">\n        <div aria-hidden=\"true\" style=\"height:42px;background:#fff;border:1px solid var(--rule);display:flex;align-items:center;gap:5px;padding:0 9px\"><span style=\"width:14px;height:14px;border-radius:50%;border:1px solid var(--acl)\"><\u002Fspan><span style=\"width:14px;height:14px;border-radius:50%;border:1px solid var(--rule)\"><\u002Fspan><span style=\"width:14px;height:14px;border-radius:50%;border:1px solid var(--rule)\"><\u002Fspan><\u002Fdiv>\n        <h3 style=\"margin:0;font:500 15px var(--s)\"><span style=\"font:400 10px var(--m);color:var(--soft);margin-right:7px\">02<\u002Fspan>Research<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:var(--mid)\">Talk to the people who use it and the people who maintain it. Both change the design.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--bg);padding:18px;display:flex;flex-direction:column;gap:11px\">\n        <div aria-hidden=\"true\" style=\"height:42px;background:#fff;border:1px solid var(--rule);display:flex;align-items:center;gap:4px;padding:0 9px\"><span style=\"width:8px;height:8px;background:var(--acl)\"><\u002Fspan><span style=\"flex:1;height:1px;background:var(--rule)\"><\u002Fspan><span style=\"width:8px;height:8px;background:#ddd3bf\"><\u002Fspan><span style=\"flex:1;height:1px;background:var(--rule)\"><\u002Fspan><span style=\"width:8px;height:8px;background:#ddd3bf\"><\u002Fspan><\u002Fdiv>\n        <h3 style=\"margin:0;font:500 15px var(--s)\"><span style=\"font:400 10px var(--m);color:var(--soft);margin-right:7px\">03<\u002Fspan>IA and flows<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:var(--mid)\">Structure first. Most page problems are really navigation and hierarchy problems.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--bg);padding:18px;display:flex;flex-direction:column;gap:11px\">\n        <div aria-hidden=\"true\" style=\"height:42px;background:#fff;border:1px dashed #cdc4b3;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 9px\"><span style=\"width:60%;height:4px;background:#ece5d8\"><\u002Fspan><span style=\"width:80%;height:4px;background:#f1ebdf\"><\u002Fspan><span style=\"width:40%;height:4px;background:#f1ebdf\"><\u002Fspan><\u002Fdiv>\n        <h3 style=\"margin:0;font:500 15px var(--s)\"><span style=\"font:400 10px var(--m);color:var(--soft);margin-right:7px\">04<\u002Fspan>Wireframes<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:var(--mid)\">Cheap and plentiful, so the expensive decisions get made while changing them is still easy.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--bg);padding:18px;display:flex;flex-direction:column;gap:11px\">\n        <div aria-hidden=\"true\" style=\"height:42px;background:#fff;border:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 9px\"><span style=\"width:52%;height:7px;background:var(--ink)\"><\u002Fspan><span style=\"width:74%;height:4px;background:#ece5d8\"><\u002Fspan><span style=\"width:34px;height:9px;background:var(--ac)\"><\u002Fspan><\u002Fdiv>\n        <h3 style=\"margin:0;font:500 15px var(--s)\"><span style=\"font:400 10px var(--m);color:var(--soft);margin-right:7px\">05<\u002Fspan>High fidelity in Figma<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:var(--mid)\">Built from the library, with variants and tokens, so the file is a build spec and not a picture.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--bg);padding:18px;display:flex;flex-direction:column;gap:11px\">\n        <div aria-hidden=\"true\" style=\"height:42px;background:#fff;border:1px solid var(--ink);display:flex;align-items:center;gap:6px;padding:0 9px\"><span style=\"font:400 9px var(--m);color:var(--ac)\">&lt;/&gt;<\u002Fspan><span style=\"flex:1;height:5px;background:#ece5d8\"><\u002Fspan><span style=\"width:18px;height:12px;background:var(--ac)\"><\u002Fspan><\u002Fdiv>\n        <h3 style=\"margin:0;font:500 15px var(--s)\"><span style=\"font:400 10px var(--m);color:var(--soft);margin-right:7px\">06<\u002Fspan>Ship with engineering<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:var(--mid)\">In the code review, in the CMS, answering the awkward edge-case questions until it is live.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:clamp(22px,3vw,30px) 0 0;max-width:66ch;font-size:16.5px;color:var(--mid);text-wrap:pretty\">In practice this runs against a rolling backlog with broad, sometimes ambiguous scope, and no one to hand the ambiguity to. I work independently, prioritize what moves the metric or unblocks a build, and write down the decisions so the next person does not have to guess. That is the job a contract designer actually walks into.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"research\" style=\"padding:clamp(56px,8vw,110px) clamp(20px,5vw,64px);border-top:1px solid var(--rule);background:var(--paper)\">\n  <div style=\"max-width:1120px;margin:0 auto\">\n    <p style=\"margin:0 0 16px;font:400 11px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)\">Research practice<\u002Fp>\n    <h2 style=\"margin:0;max-width:26ch;font:400 clamp(30px,4.6vw,58px)/1.03 var(--d);letter-spacing:-.02em;text-wrap:balance\">Research is how I earn the right to design.<\u002Fh2>\n    <p style=\"margin:22px 0 0;max-width:68ch;font-size:19px;line-height:1.6;color:var(--mid);text-wrap:pretty\">I have run studies with middle-school students in classrooms, teachers across nine states, volunteer contributors in 51 languages, and executives in boardrooms. I hold an M.S. in Human-Computer Interaction and CITI human-subjects certification, and I have published peer-reviewed research. What I care about is the part after the readout, when a finding becomes a component, a flow, or a page that works better.<\u002Fp>\n    <div style=\"margin-top:clamp(30px,4vw,52px);max-width:960px\">\n    <figure data-reveal=\"\" style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n      <div role=\"img\" aria-label=\"Research wall placeholder: a dense grid of clustered sticky notes on the left resolvi
